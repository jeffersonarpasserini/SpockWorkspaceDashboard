schema: spec-driven

context: |
  Spock Workspace Dashboard is evolving from a read-mostly local dashboard into a persistent
  project control plane for software work performed by humans and AI agents. It uses TypeScript,
  Next.js and React for the web application, a separate Node.js worker for synchronization and
  orchestration, and PostgreSQL as the durable system of record. OpenSpec remains the versioned
  source of intent; PostgreSQL owns stable identities, assignments, runs, usage, costs, evidence,
  audit events and derived projections.

  Hermes remains the model/profile gateway and the existing Python agent-orchestrator remains the
  LangGraph workflow service. Spock integrates through versioned APIs and events rather than
  reimplementing provider access. A future remote daemon may use Go behind the runner protocol,
  but the initial control plane and worker remain TypeScript to avoid a premature rewrite.

  The application must remain useful when a runner, Git, OpenSpec or an external provider is unavailable.
  Secrets remain server-side and must never be returned to the browser or written to logs.
  Status must distinguish declared intent, observed evidence, execution, validation and release;
  completion must never be inferred from file presence or an agent success message. Every cost and
  duration must declare its definition, provenance and confidence.

rules:
  proposal:
    - Include explicit goals, non-goals, operational risks and affected data sources.
  specs:
    - Use MUST or SHALL for normative behavior and at least one WHEN/THEN scenario per requirement.
    - Include degraded-mode, path-containment, secret-handling and accessibility requirements.
  design:
    - Describe trust boundaries, adapters, status derivation, testing and failure behavior.
  tasks:
    - Use test-first vertical slices and include exact validation, build and runtime checks.

operations:
  apply:
    guidance:
      - Follow RED-GREEN-REFACTOR for every production behavior.
      - Keep workspace and Hermes integrations behind typed adapters.
  archive:
    guidance:
      - Archive only after tests, build, OpenSpec validation and documentation are current.
